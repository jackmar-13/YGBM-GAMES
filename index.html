 <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSANE PRO GAME HUB</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#070a12;
  color:white;
  text-align:center;
}

h1{margin:10px;}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  padding:10px;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:#1f6fff;
  color:white;
  font-weight:bold;
}

button:hover{background:#3a86ff;}

.screen{display:none;padding:10px;}

canvas{
  background:#111;
  border:2px solid white;
}

.small{font-size:12px;color:#aaa;}
</style>
</head>

<body>

<h1>🔥 INSANE PRO GAME HUB</h1>
<div class="small">Fully custom arcade system</div>

<div class="menu">
  <button onclick="openGame('home')">🏠 Menu</button>
  <button onclick="openGame('runner')">🏃 Runner</button>
  <button onclick="openGame('ball')">⚽ Ball Battle</button>
  <button onclick="openGame('shop')">🛒 Shop</button>
</div>

<!-- HOME -->
<div id="home" class="screen" style="display:block">
  <h2>Welcome</h2>
  <p>Coins: <span id="coins">0</span></p>
  <p>Level: <span id="level">1</span></p>
</div>

<!-- RUNNER -->
<div id="runner" class="screen">
  <h2>🏃 Level Runner</h2>
  <canvas id="rCanvas" width="320" height="160"></canvas>
  <p class="small">Space = jump</p>
</div>

<!-- BALL -->
<div id="ball" class="screen">
  <h2>⚽ Ball Battle</h2>
  <canvas id="bCanvas" width="320" height="200"></canvas>
</div>

<!-- SHOP -->
<div id="shop" class="screen">
  <h2>🛒 Shop</h2>
  <button onclick="buySpeed()">Buy Speed (20)</button>
  <button onclick="buyLevel()">Unlock Level (50)</button>
</div>

<script>

/* ---------------- SYSTEM ---------------- */
let coins = 0;
let level = 1;
let speedBoost = 1;

function save(){
  localStorage.setItem("proHub", JSON.stringify({coins,level,speedBoost}));
}
function load(){
  let d = JSON.parse(localStorage.getItem("proHub"));
  if(d){
    coins=d.coins;
    level=d.level;
    speedBoost=d.speedBoost;
  }
}
load();

function updateUI(){
  document.getElementById("coins").innerText = coins;
  document.getElementById("level").innerText = level;
}
updateUI();

/* ---------------- NAV ---------------- */
function openGame(id){
  document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

/* ---------------- RUNNER (Dash style) ---------------- */
const r = document.getElementById("rCanvas");
const rx = r.getContext("2d");

let player = {x:30,y:120,vy:0};
let gravity = 0.6;
let obstacles = [{x:320}];

document.addEventListener("keydown",e=>{
  if(e.code==="Space" && player.y===120){
    player.vy = -11;
  }
});

function runner(){
  rx.fillStyle="#000";
  rx.fillRect(0,0,320,160);

  player.vy += gravity;
  player.y += player.vy;

  if(player.y > 120){player.y=120;player.vy=0;}

  obstacles.forEach(o=>{
    o.x -= (3 + speedBoost);

    if(o.x < -20){
      o.x = 320;
      coins += 1;
      save();
      updateUI();
    }

    // collision
    if(o.x < 50 && o.x > 20 && player.y > 100){
      o.x = 320;
      coins = Math.max(0, coins-2);
      save();
      updateUI();
    }

    rx.fillStyle="red";
    rx.fillRect(o.x,130,20,20);
  });

  rx.fillStyle="lime";
  rx.fillRect(player.x,player.y,20,20);

  requestAnimationFrame(runner);
}
runner();

/* ---------------- BALL GAME ---------------- */
const b = document.getElementById("bCanvas");
const bx = b.getContext("2d");

let ball = {x:160,y:100,dx:3,dy:2};
let p1 = {y:100};
let p2 = {y:100};

document.addEventListener("mousemove",e=>{
  let r=b.getBoundingClientRect();
  p1.y = e.clientY - r.top;
});

function ballGame(){
  bx.fillStyle="#000";
  bx.fillRect(0,0,320,200);

  ball.x += ball.dx;
  ball.y += ball.dy;

  if(ball.y < 0 || ball.y > 200) ball.dy *= -1;

  // player hit
  if(ball.x < 30 && ball.y > p1.y-20 && ball.y < p1.y+40){
    ball.dx *= -1;
  }

  // AI
  p2.y += (ball.y - p2.y)*0.05;

  if(ball.x > 290 && ball.y > p2.y-20 && ball.y < p2.y+40){
    ball.dx *= -1;
  }

  bx.fillStyle="white";
  bx.fillRect(20,p1.y,10,40);
  bx.fillRect(290,p2.y,10,40);

  bx.fillStyle="yellow";
  bx.fillRect(ball.x,ball.y,10,10);

  requestAnimationFrame(ballGame);
}
ballGame();

/* ---------------- SHOP ---------------- */
function buySpeed(){
  if(coins >= 20){
    coins -= 20;
    speedBoost += 1;
    save();
    updateUI();
  }
}

function buyLevel(){
  if(coins >= 50){
    coins -= 50;
    level += 1;
    save();
    updateUI();
  }
}
</script>

</body>
</html>
