<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Game Hub</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b0f1a;
  color:white;
}

.top{
  padding:10px;
  background:#11172a;
  text-align:center;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  padding:10px;
}

.card{
  background:#151c33;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}
.card:hover{background:#1c2550;}

.screen{display:none;padding:10px;}

canvas{
  background:#000;
  border:2px solid white;
}
</style>
</head>

<body>

<div class="top">🎮 PRO ARCADE HUB</div>

<div id="home" class="grid">

  <div class="card" onclick="openGame('dash')">🏃 Rhythm Dash</div>
  <div class="card" onclick="openGame('love')">💖 Love Test</div>
  <div class="card" onclick="openGame('mart')">🛒 Mini Mart</div>
  <div class="card" onclick="openGame('car')">🚗 Car Arcade (20 Modes)</div>

</div>

<!-- DASH -->
<div id="dash" class="screen">
<h3>🏃 Rhythm Dash</h3>
<canvas id="dashC" width="320" height="160"></canvas>
</div>

<!-- LOVE -->
<div id="love" class="screen">
<h3>💖 Love Test</h3>
<input id="a" placeholder="Name 1">
<input id="b" placeholder="Name 2">
<button onclick="love()">Test</button>
<h2 id="res"></h2>
</div>

<!-- MART -->
<div id="mart" class="screen">
<h3>🛒 Mini Mart</h3>
<p>Coins: <span id="coins">0</span></p>
<button onclick="buy()">Buy (+1/sec)</button>
</div>

<!-- CAR ARCADE -->
<div id="car" class="screen">
<h3>🚗 Car Arcade</h3>
<p>Mode: <span id="mode">City Drift</span></p>
<button onclick="nextMode()">Next Mode</button>
<canvas id="carC" width="320" height="160"></canvas>
</div>

<script>

/* NAV */
function openGame(id){
  document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

/* ---------------- LOVE ---------------- */
function love(){
  let score = Math.floor(Math.random()*101);
  document.getElementById("res").innerText = score + "% match 💖";
}

/* ---------------- MART ---------------- */
let coins=0,cps=0;
function buy(){ if(coins>=10){coins-=10;cps++;} }
setInterval(()=>{coins+=cps;document.getElementById("coins").innerText=coins;},1000);

/* ---------------- DASH ---------------- */
const d=document.getElementById("dashC");
const dx=d.getContext("2d");
let py=120,vy=0,obs=320;

document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&py===120) vy=-10;
});

function dash(){
  dx.fillStyle="#000";dx.fillRect(0,0,320,160);

  vy+=0.6;py+=vy;
  if(py>120){py=120;vy=0;}

  obs-=3;if(obs<0)obs=320;

  dx.fillStyle="red";dx.fillRect(obs,130,20,20);
  dx.fillStyle="lime";dx.fillRect(30,py,20,20);

  requestAnimationFrame(dash);
}
dash();

/* ---------------- CAR ARCADE (20 MODES IDEA SYSTEM) ---------------- */
const modes = [
"City Drift","Highway Dodge","Police Chase","Parking Pro","Ice Drift",
"Drag Race","Stunt Jump","Time Trial","Tunnel Run","Night Drive",
"Bus Drive","Taxi Run","Crash Survival","Lane Switch","Fuel Run",
"Mountain Road","Reverse Parking","Speed Test","Offroad","Traffic Escape"
];

let mIndex=0;
let carX=160;

function nextMode(){
  mIndex = (mIndex+1)%modes.length;
  document.getElementById("mode").innerText = modes[mIndex];
}

const c=document.getElementById("carC");
const cx=c.getContext("2d");

function carLoop(){
  cx.fillStyle="#000";
  cx.fillRect(0,0,320,160);

  // road
  cx.fillStyle="#333";
  cx.fillRect(80,0,160,160);

  // car
  cx.fillStyle="red";
  cx.fillRect(carX,120,20,30);

  cx.fillStyle="white";
  cx.fillText(modes[mIndex],10,20);

  requestAnimationFrame(carLoop);
}
carLoop();

</script>

</body>
</html>
